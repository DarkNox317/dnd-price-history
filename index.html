<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<title>다크앤다커 시세 기록</title>
<style>
  *, *::before, *::after { box-sizing: border-box; }
  :root {
    --ground: #f7f5f0; --surface: #fcfcfb; --edge: #ddd8cc;
    --ink: #211f1b; --ink-2: #4a453d; --muted: #6b655b;
    --accent: #a8761c; --vol: #008a72; --grid: #e6e1d5;
    --mono: "Cascadia Mono", "Consolas", monospace;
    --sans: "Segoe UI", "Malgun Gothic", system-ui, sans-serif;
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      --ground: #12110f; --surface: #1a1917; --edge: #322f2a;
      --ink: #e6e1d6; --ink-2: #b8b1a3; --muted: #8f887b;
      --accent: #b8842a; --vol: #0d9683; --grid: #262421;
    }
  }
  :root[data-theme="dark"] {
    --ground: #12110f; --surface: #1a1917; --edge: #322f2a;
    --ink: #e6e1d6; --ink-2: #b8b1a3; --muted: #8f887b;
    --accent: #b8842a; --vol: #0d9683; --grid: #262421;
  }

  body { margin: 0; background: var(--ground); color: var(--ink);
    font-family: var(--sans); line-height: 1.55; padding: 1.5rem 1rem 4rem; }
  .wrap { max-width: 56rem; margin: 0 auto; }
  header { margin-bottom: 1.2rem; padding-right: 6.5rem; }
  .eyebrow { font-family: var(--mono); font-size: .7rem; letter-spacing: .14em;
    text-transform: uppercase; color: var(--muted); margin: 0 0 .3rem; }
  h1 { font-size: 1.6rem; margin: 0; letter-spacing: -.01em; }
  .sub { color: var(--ink-2); font-size: .85rem; margin: .4rem 0 0; }

  #theme-toggle { position: fixed; top: 1rem; right: 1rem; z-index: 5;
    background: var(--surface); color: var(--ink-2); border: 1px solid var(--edge);
    border-radius: 3px; padding: .4rem .7rem; cursor: pointer;
    font-family: var(--mono); font-size: .7rem; }
  #theme-toggle:hover { border-color: var(--ink-2); color: var(--ink); }

  .searchbox { position: relative; margin-bottom: 1rem; }
  #q { width: 100%; padding: .7rem .9rem; font-size: 1rem;
    background: var(--surface); color: var(--ink);
    border: 1px solid var(--edge); border-radius: 4px; font-family: var(--sans); }
  #q:focus { outline: 2px solid var(--accent); outline-offset: 1px; }
  #hits { position: absolute; left: 0; right: 0; top: calc(100% + 4px); z-index: 10;
    background: var(--surface); border: 1px solid var(--edge); border-radius: 4px;
    max-height: 21rem; overflow-y: auto; box-shadow: 0 8px 24px rgba(0,0,0,.12); }
  #hits:empty { display: none; }
  .hit { display: flex; align-items: center; gap: .55rem; padding: .5rem .8rem;
    cursor: pointer; font-size: .92rem; }
  .hit:hover, .hit.on { background: var(--ground); }
  .hit .en { color: var(--muted); font-size: .78rem; margin-left: auto; font-family: var(--mono); }
  .rdot { width: .6rem; height: .6rem; border-radius: 50%; flex: none; border: 1px solid rgba(0,0,0,.2); }

  .panel { background: var(--surface); border: 1px solid var(--edge); border-radius: 4px;
    padding: 1rem 1rem .8rem; }
  .item-head { display: flex; align-items: baseline; gap: .6rem; flex-wrap: wrap; margin-bottom: .3rem; }
  .item-head h2 { margin: 0; font-size: 1.15rem; }
  .item-head .en { color: var(--muted); font-family: var(--mono); font-size: .78rem; }
  .item-head .rar { font-size: .75rem; color: var(--ink-2); border: 1px solid var(--edge);
    border-radius: 999px; padding: .1rem .55rem; }

  .ranges { display: flex; gap: .4rem; margin: .6rem 0 .8rem; flex-wrap: wrap; }
  .rng { background: var(--ground); border: 1px solid var(--edge); border-radius: 999px;
    padding: .25rem .8rem; cursor: pointer; font-size: .8rem; color: var(--ink-2);
    font-family: var(--sans); }
  .rng[data-on="1"] { border-color: var(--accent); color: var(--accent); font-weight: 600; }

  figure { margin: 0; position: relative; }
  svg { display: block; width: 100%; height: auto; overflow: visible; }
  .tip { position: absolute; pointer-events: none; background: var(--ground);
    border: 1px solid var(--edge); border-radius: 3px; padding: .35rem .55rem;
    font-family: var(--mono); font-size: .72rem; color: var(--ink);
    white-space: pre; opacity: 0; z-index: 5; line-height: 1.5; }

  .stats { display: flex; gap: 1.4rem; flex-wrap: wrap; margin-top: .6rem;
    font-family: var(--mono); font-size: .8rem; color: var(--ink-2); }
  .stats b { color: var(--ink); font-size: 1rem; }
  .empty { color: var(--muted); padding: 2.5rem 0; text-align: center; font-size: .9rem; }
  .note { margin-top: 1.1rem; font-size: .75rem; color: var(--muted); line-height: 1.6; }
</style>
</head>
<body>
<button id="theme-toggle" type="button">테마 전환</button>
<div class="wrap">

<header>
  <p class="eyebrow">Dark and Darker · Price History</p>
  <h1>시세 기록</h1>
  <p class="sub">아이템을 검색하면 날짜별 판매 시세(중앙값)와 거래량을 보여줘.</p>
</header>

<div class="searchbox">
  <input id="q" type="search" placeholder="아이템 검색 (한글/영문)" autocomplete="off">
  <div id="hits"></div>
</div>

<div class="panel" id="panel">
  <div class="empty" id="placeholder">위에서 아이템을 검색해서 선택해줘.</div>
  <div id="view" hidden>
    <div class="item-head">
      <span class="rdot" id="v_dot"></span>
      <h2 id="v_ko"></h2>
      <span class="en" id="v_en"></span>
      <span class="rar" id="v_rar"></span>
    </div>
    <div class="ranges" id="ranges">
      <button class="rng" data-d="14" data-on="1" type="button">2주</button>
      <button class="rng" data-d="30" type="button">1달</button>
      <button class="rng" data-d="90" type="button">3달</button>
      <button class="rng" data-d="0" type="button">전체</button>
    </div>
    <figure>
      <div id="chart"></div>
      <div class="tip" id="tip"></div>
    </figure>
    <div class="stats" id="stats"></div>
    <div class="empty" id="nodata" hidden>이 기간에 판매 기록이 없어.</div>
  </div>
</div>

<p class="note">
  하루 1회 수집 (UTC 자정 기준 전날 판매분) · 가격은 개당 판매가의 <b>중앙값</b>, 거래량은 그날 판매 건수 ·
  가장 비싸게/싸게 팔린 값은 점 위에 마우스를 올리면 표시 · 데이터 출처: DarkerDB
</p>

</div>

<script>
(function () {
  const $ = (id) => document.getElementById(id);
  const RARITY_COLOR = {
    poor: "#888888", common: "#eeeeee", uncommon: "#80d600", rare: "#00aaee",
    epic: "#d067ff", legendary: "#ff9a00", unique: "#ecd99a", artifact: "#e60505"
  };
  const RARITY_KO = {
    poor: "초라한", common: "일반적인", uncommon: "고급", rare: "희귀한",
    epic: "서사적인", legendary: "전설적인", unique: "유일한", artifact: "유물"
  };

  let CATALOG = {};        // id -> [ko, en, rarity]
  let MONTHS = [];         // ["2026-08", ...]
  const monthData = {};    // "2026-08" -> {date -> {id -> [med,min,max,cnt]}}
  let currentItem = null;
  let currentDays = 14;

  const fmtGold = (v) => v >= 10000 ? (Math.round(v / 100) / 10) + "k" : Math.round(v).toLocaleString();

  async function boot () {
    const [cat, months] = await Promise.all([
      fetch("catalog.json").then(r => r.json()),
      fetch("data/months.json").then(r => r.ok ? r.json() : []).catch(() => []),
    ]);
    CATALOG = cat;
    MONTHS = months;
    const h = decodeURIComponent(location.hash.slice(1));
    if (h && CATALOG[h]) selectItem(h);
  }

  async function loadMonth (m) {
    if (monthData[m] !== undefined) return monthData[m];
    try {
      monthData[m] = await fetch("data/" + m + ".json").then(r => r.json());
    } catch (e) { monthData[m] = {}; }
    return monthData[m];
  }

  /* ── 검색 ── */
  const q = $("q"), hits = $("hits");
  let hitIds = [], hitSel = -1;

  function search (text) {
    const t = text.trim().toLowerCase();
    hits.innerHTML = ""; hitIds = []; hitSel = -1;
    if (t.length < 1) return;
    const starts = [], contains = [];
    for (const id in CATALOG) {
      const [ko, en] = CATALOG[id];
      const k = ko.toLowerCase(), e = en.toLowerCase();
      if (k.startsWith(t) || e.startsWith(t)) starts.push(id);
      else if (k.includes(t) || e.includes(t)) contains.push(id);
      if (starts.length > 40) break;
    }
    hitIds = starts.concat(contains).slice(0, 30);
    hits.innerHTML = hitIds.map(id => {
      const [ko, en, rar] = CATALOG[id];
      return '<div class="hit" data-id="' + id + '">' +
        '<span class="rdot" style="background:' + (RARITY_COLOR[rar] || "#999") + '"></span>' +
        '<span>' + ko + '</span><span class="en">' + en + (rar ? " · " + rar : "") + '</span></div>';
    }).join("");
  }
  q.addEventListener("input", () => search(q.value));
  q.addEventListener("keydown", (ev) => {
    if (ev.key === "Enter" && hitIds.length) { selectItem(hitIds[Math.max(0, hitSel)]); }
    if (ev.key === "ArrowDown") { hitSel = Math.min(hitIds.length - 1, hitSel + 1); paintSel(); ev.preventDefault(); }
    if (ev.key === "ArrowUp") { hitSel = Math.max(0, hitSel - 1); paintSel(); ev.preventDefault(); }
    if (ev.key === "Escape") { hits.innerHTML = ""; }
  });
  function paintSel () {
    [...hits.children].forEach((el, i) => el.classList.toggle("on", i === hitSel));
  }
  hits.addEventListener("click", (ev) => {
    const el = ev.target.closest(".hit");
    if (el) selectItem(el.dataset.id);
  });
  document.addEventListener("click", (ev) => {
    if (!ev.target.closest(".searchbox")) hits.innerHTML = "";
  });

  /* ── 선택·범위 ── */
  async function selectItem (id) {
    currentItem = id;
    location.hash = encodeURIComponent(id);
    hits.innerHTML = "";
    const [ko, en, rar] = CATALOG[id];
    q.value = ko;
    $("placeholder").hidden = true;
    $("view").hidden = false;
    $("v_ko").textContent = ko;
    $("v_en").textContent = en;
    $("v_rar").textContent = RARITY_KO[rar] || rar || "—";
    $("v_dot").style.background = RARITY_COLOR[rar] || "#999";
    await render();
  }

  $("ranges").addEventListener("click", async (ev) => {
    const b = ev.target.closest(".rng");
    if (!b) return;
    currentDays = parseInt(b.dataset.d, 10);
    [...$("ranges").children].forEach(x => x.dataset.on = x === b ? "1" : "0");
    await render();
  });

  /* ── 시리즈 구성 ── */
  async function buildSeries () {
    const rows = [];
    for (const m of MONTHS) {
      const md = await loadMonth(m);
      for (const date in md) {
        const rec = md[date][currentItem];
        if (rec) rows.push({ date, med: rec[0], min: rec[1], max: rec[2], cnt: rec[3] });
      }
    }
    rows.sort((a, b) => a.date < b.date ? -1 : 1);
    if (currentDays > 0 && rows.length) {
      const cut = new Date(Date.now() - currentDays * 864e5).toISOString().slice(0, 10);
      return rows.filter(r => r.date >= cut);
    }
    return rows;
  }

  /* ── 차트 ── */
  const W = 720, H = 260, VH = 64, P = { t: 12, r: 14, b: 22, l: 52 };

  async function render () {
    const rows = await buildSeries();
    const chart = $("chart"), tip = $("tip"), stats = $("stats");
    $("nodata").hidden = rows.length > 0;
    stats.innerHTML = ""; chart.innerHTML = "";
    if (!rows.length) return;

    const meds = rows.map(r => r.med);
    let lo = Math.min(...meds), hi = Math.max(...meds);
    const pad = (hi - lo) * 0.12 || Math.max(1, hi * 0.1);
    lo = Math.max(0, lo - pad); hi += pad;
    const maxCnt = Math.max(...rows.map(r => r.cnt), 1);

    const sx = (i) => rows.length === 1 ? W / 2 :
      P.l + (i / (rows.length - 1)) * (W - P.l - P.r);
    const sy = (v) => H - P.b - ((v - lo) / (hi - lo)) * (H - P.t - P.b);

    const line = rows.map((r, i) => (i ? "L" : "M") + sx(i).toFixed(1) + "," + sy(r.med).toFixed(1)).join(" ");
    const area = line + " L" + sx(rows.length - 1).toFixed(1) + "," + (H - P.b) +
                 " L" + sx(0).toFixed(1) + "," + (H - P.b) + " Z";

    const yTicks = [lo + pad, (lo + hi) / 2, hi - pad].map(v =>
      '<line x1="' + P.l + '" y1="' + sy(v).toFixed(1) + '" x2="' + (W - P.r) + '" y2="' + sy(v).toFixed(1) + '" stroke="var(--grid)"/>' +
      '<text x="' + (P.l - 6) + '" y="' + (sy(v) + 3).toFixed(1) + '" fill="var(--muted)" font-size="10" font-family="var(--mono)" text-anchor="end">' + fmtGold(v) + '</text>'
    ).join("");

    const nLab = Math.min(6, rows.length);
    const xLabs = Array.from({ length: nLab }, (_, k) => {
      const i = Math.round(k * (rows.length - 1) / Math.max(1, nLab - 1));
      return '<text x="' + sx(i).toFixed(1) + '" y="' + (H - P.b + 14) + '" fill="var(--muted)" font-size="9" font-family="var(--mono)" text-anchor="middle">' + rows[i].date.slice(5) + '</text>';
    }).join("");

    const dots = rows.length <= 60 ? rows.map((r, i) =>
      '<circle cx="' + sx(i).toFixed(1) + '" cy="' + sy(r.med).toFixed(1) + '" r="3" fill="var(--accent)" stroke="var(--surface)" stroke-width="1.5"/>'
    ).join("") : "";

    const bw = Math.max(2, Math.min(14, (W - P.l - P.r) / rows.length - 2));
    const vols = rows.map((r, i) =>
      '<rect x="' + (sx(i) - bw / 2).toFixed(1) + '" y="' + (VH - 6 - (r.cnt / maxCnt) * (VH - 12)).toFixed(1) +
      '" width="' + bw.toFixed(1) + '" height="' + ((r.cnt / maxCnt) * (VH - 12)).toFixed(1) +
      '" rx="1.5" fill="var(--vol)" opacity=".75"/>'
    ).join("");

    chart.innerHTML =
      '<svg viewBox="0 0 ' + W + ' ' + H + '" role="img" aria-label="시세 차트">' +
      '<defs><linearGradient id="g" x1="0" y1="0" x2="0" y2="1">' +
      '<stop offset="0%" stop-color="var(--accent)" stop-opacity=".15"/>' +
      '<stop offset="100%" stop-color="var(--accent)" stop-opacity="0"/></linearGradient></defs>' +
      yTicks + '<path d="' + area + '" fill="url(#g)"/>' +
      '<path d="' + line + '" fill="none" stroke="var(--accent)" stroke-width="2" stroke-linejoin="round"/>' +
      dots + xLabs +
      '<line id="cross" y1="' + P.t + '" y2="' + (H - P.b) + '" stroke="var(--ink-2)" opacity="0"/>' +
      '<circle id="cursor" r="4" fill="var(--accent)" stroke="var(--surface)" stroke-width="2" opacity="0"/>' +
      '<rect id="hit" x="' + P.l + '" y="' + P.t + '" width="' + (W - P.l - P.r) + '" height="' + (H - P.t - P.b) + '" fill="transparent"/>' +
      '</svg>' +
      '<svg viewBox="0 0 ' + W + ' ' + VH + '" role="img" aria-label="거래량">' +
      '<text x="' + (P.l - 6) + '" y="14" fill="var(--muted)" font-size="9" font-family="var(--mono)" text-anchor="end">거래량</text>' +
      vols + '</svg>';

    const last = rows[rows.length - 1];
    const tot = rows.reduce((s, r) => s + r.cnt, 0);
    stats.innerHTML =
      '<span>최근 중앙값 <b>' + fmtGold(last.med) + '</b></span>' +
      '<span>기간 최저 <b>' + fmtGold(Math.min(...rows.map(r => r.min))) + '</b></span>' +
      '<span>기간 최고 <b>' + fmtGold(Math.max(...rows.map(r => r.max))) + '</b></span>' +
      '<span>기간 거래 <b>' + tot.toLocaleString() + '건</b></span>' +
      '<span>기록 <b>' + rows.length + '일</b></span>';

    const svg = chart.querySelector("svg");
    const hit = svg.querySelector("#hit"), cross = svg.querySelector("#cross"), cur = svg.querySelector("#cursor");
    hit.addEventListener("mousemove", (ev) => {
      const rect = svg.getBoundingClientRect();
      const px = ((ev.clientX - rect.left) / rect.width) * W;
      let i = Math.round((px - P.l) / (W - P.l - P.r) * (rows.length - 1));
      i = Math.max(0, Math.min(rows.length - 1, i));
      const r = rows[i];
      cross.setAttribute("x1", sx(i)); cross.setAttribute("x2", sx(i)); cross.setAttribute("opacity", ".3");
      cur.setAttribute("cx", sx(i)); cur.setAttribute("cy", sy(r.med)); cur.setAttribute("opacity", "1");
      tip.textContent = r.date + "\n중앙값 " + fmtGold(r.med) + "  (" + fmtGold(r.min) + "~" + fmtGold(r.max) + ")\n거래 " + r.cnt + "건";
      tip.style.opacity = "1";
      tip.style.left = Math.min(rect.width - 150, Math.max(0, (sx(i) / W) * rect.width + 10)) + "px";
      tip.style.top = Math.max(0, (sy(r.med) / H) * rect.height - 40) + "px";
    });
    hit.addEventListener("mouseleave", () => {
      cross.setAttribute("opacity", "0"); cur.setAttribute("opacity", "0"); tip.style.opacity = "0";
    });
  }

  /* ── 테마 ── */
  const root = document.documentElement;
  try { const s = localStorage.getItem("ddc-theme"); if (s) root.setAttribute("data-theme", s); } catch (e) {}
  $("theme-toggle").addEventListener("click", () => {
    const dark = root.getAttribute("data-theme") === "dark" ||
      (!root.getAttribute("data-theme") && matchMedia("(prefers-color-scheme: dark)").matches);
    const next = dark ? "light" : "dark";
    root.setAttribute("data-theme", next);
    try { localStorage.setItem("ddc-theme", next); } catch (e) {}
  });

  boot();
})();
</script>
</body>
</html>
