name: collect5m

on:
  schedule:
    # 하루 1회, UTC 자정 직후. 수집 대상은 "UTC 오늘-2"(24시간 텀 확보)이므로
    # 자정을 넘긴 직후가 가장 신선하다 — 자정 전(예: 21:37)에 돌리면 하루가 통째로 늦어짐(2026-09-05 실수).
    # GitHub 스케줄러가 몇 시간 밀려 시작해도 같은 UTC 날짜 안이면 대상 날짜는 동일 → 무해.
    # 밀리거나 건너뛰어도 다음 실행이 오래된 날짜부터 체인으로 따라잡음.
    - cron: "19 0 * * *"
  workflow_dispatch:
    inputs:
      date:
        description: "UTC date YYYY-MM-DD (default: auto backfill)"
        required: false

concurrency:
  group: collect
  cancel-in-progress: false

permissions:
  contents: write
  actions: write   # 체인: 다음 날짜 실행을 스스로 예약

jobs:
  collect5m:
    runs-on: ubuntu-latest
    timeout-minutes: 340
    steps:
      - uses: actions/checkout@v4

      - name: Sweep full day (5-minute buckets)
        env:
          DARKERDB_API_KEY: ${{ secrets.DARKERDB_API_KEY }}
          COLLECT_DATE: ${{ inputs.date }}
        run: python collect5m.py ${COLLECT_DATE:+--date $COLLECT_DATE} ${COLLECT_DATE:---auto}

      - name: Upload raw trade archive
        uses: actions/upload-artifact@v4
        with:
          name: raw-${{ github.run_id }}
          path: rawout/*.jsonl.gz
          retention-days: 90
          if-no-files-found: ignore
          compression-level: 0

      - name: Commit data
        run: |
          git config user.name "DarkNox317"
          git config user.email "DarkNox317@users.noreply.github.com"
          # 이번 실행이 실제로 건드린 파일 목록 (리베이스 충돌로 스윕을 날리지 않기 위함)
          CHANGED=$(git status --porcelain -- data5m data2 patches.json | awk '{print $NF}')
          if [ -z "$CHANGED" ]; then echo "no changes"; exit 0; fi
          for i in 1 2 3 4 5; do
            git fetch -q origin main
            git reset -q origin/main          # 리베이스 대신 최신 위에 다시 얹기 → 충돌 자체가 없음
            git add -- $CHANGED
            if git diff --cached --quiet; then echo "already up to date"; exit 0; fi
            git commit -q -m "data5m: update"
            if git push -q origin main; then echo "pushed (attempt $i)"; exit 0; fi
            echo "push raced — retry $i"
            sleep 5
          done
          echo "commit failed after 5 attempts"; exit 1

      - name: Chain next day
        if: success()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if python3 - <<'EOF'
          import datetime as dt, os, sys
          have = set()
          if os.path.isdir("data5m"):
              have = {f[:-5] for f in os.listdir("data5m") if f.endswith(".json") and f != "index.json"}
          today = dt.datetime.now(dt.timezone.utc).date()
          # 수집기(collect5m.py --auto)와 동일 범위: 24시간 텀 확보 위해 today-1 제외, today-2부터
          missing = [(today - dt.timedelta(days=b)).strftime("%Y-%m-%d") for b in range(2, 16)]
          sys.exit(0 if any(d not in have for d in missing) else 1)
          EOF
          then
            gh workflow run collect5m.yml
            echo "미수집 날짜 남음 - 다음 실행 즉시 예약"
          else
            echo "수집할 날짜 없음 - 체인 종료 (크론이 새 날짜를 이어받음)"
          fi
