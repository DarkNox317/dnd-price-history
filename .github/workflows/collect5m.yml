name: collect5m

on:
  schedule:
    - cron: "23 */2 * * *"
  workflow_dispatch:
    inputs:
      date:
        description: "UTC date YYYY-MM-DD (default: auto backfill)"
        required: false

concurrency:
  group: collect
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  collect5m:
    runs-on: ubuntu-latest
    timeout-minutes: 340
    steps:
      - uses: actions/checkout@v4

      - name: Sweep full day (5-minute buckets)
        env:
          DARKERDB_API_KEY: ${{ secrets.DARKERDB_API_KEY }}
          COLLECT_DATE: ${{ inputs.date }}
        run: python collect5m.py ${COLLECT_DATE:+--date $COLLECT_DATE} ${COLLECT_DATE:---auto}

      - name: Upload raw trade archive
        uses: actions/upload-artifact@v4
        with:
          name: raw-${{ github.run_id }}
          path: rawout/*.jsonl.gz
          retention-days: 90
          if-no-files-found: ignore
          compression-level: 0

      - name: Commit data
        run: |
          git config user.name "DarkNox317"
          git config user.email "DarkNox317@users.noreply.github.com"
          git add data5m data2 patches.json
          if git diff --cached --quiet; then
            echo "no changes"
            exit 0
          fi
          git commit -m "data5m: update"
          git pull --rebase origin main
          git push origin main
